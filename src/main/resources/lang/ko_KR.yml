addon: "파일론"

item:
  bandage:
    name: "반창고"
    lore: |-
      <arrow> 멍과 상처를 치료합니다
      <arrow> <insn>오른쪽 클릭</insn>으로 사용
      <arrow> <attr>치유량:</attr> %heal-amount%
      <arrow> <attr>적용 시간:</attr> %consume-seconds%

  beheading_sword:
    name: "참수검"
    lore: |-
      <arrow> 죽인 몬스터를 참수합니다
      <arrow> %default-chance%% 확률로 플레이어, 크리퍼, 피글린, 엔더 드래곤, 스켈레톤, 좀비의 머리를 떨어뜨립니다
      <arrow> +%wither-skeleton-chance%% 확률로 위더 스켈레톤 해골을 떨어뜨립니다.

  bronze_dust:
    name: "청동 가루"

  bronze_ingot:
    name: "청동 주괴"

  bronze_nugget:
    name: "청동 조각"

  bronze_block:
    name: "청동 블록"

  bronze_sheet:
    name: "청동 판"

  cleansing_potion:
    name: "정화 물약"
    lore: |-
      <arrow> 좀비 주민을 일반 주민으로 되돌립니다
      <arrow> 또한 체력을 모두 회복시킵니다

  climbing_pick:
    name: "피켈"
    lore: |-
      <arrow> <insn>오른쪽 클릭</insn>으로 블록에 메달릴 수 있습니다
      <arrow> <insn>두 번 점프</insn>로 피켈을 밀어내며 도약할 수 있습니다
      <arrow> <insn>웅크리기</insn>로 피켈을 회수할 수 있습니다
      <arrow> <attr>도약 속도:</attr> %jump-speed%
      <arrow> <attr>갈고리 범위:</attr> %hook-range%

  coal_dust:
    name: "석탄 가루"

  carbon:
    name: "탄소"

  compressed_obsidian:
    name: "압축된 흑요석"

  compressed_wood:
    name: "압축된 나무"

  copper_dust:
    name: "구리 가루"

  copper_sheet:
    name: "구리 판"

  covalent_binder:
    name: "공유 결합제"
    lore: |-
      <arrow> 손에서 변형되었다가 돌아오기를 반복하는 끈적한 물질

  crushed_raw_copper:
    name: "분쇄된 구리 원석"

  crushed_raw_gold:
    name: "분쇄된 금 원석"

  crushed_raw_iron:
    name: "분쇄된 철 원석"

  crushed_raw_tin:
    name: "분쇄된 주석 원석"

  dimensional_barrel:
    name: "차원 통"
    lore: |-
      <arrow> 아공간을 활용해 많은 양의 아이템을 저장합니다
      <arrow> <attr>크기:</attr> %size%

  disinfectant:
    name: "소독약"
    lore: |-
      <arrow> 적용 시 모든 효과를 제거하는 혼합물입니다
      <arrow> <insn>오른쪽 클릭</insn>으로 사용
      <arrow> <attr>지속 시간:</attr> <unit:seconds>3</unit>

  dough:
    name: "반죽"

  enriched_soul_soil:
    name: "농축된 영혼 흙"
    lore: |-
      <arrow> 네더랙보다 더 밝고 뜨겁게 타오릅니다

  explosive_target:
    name: "폭발 과녁"
    lore: |-
      <arrow> 맞으면 폭발합니다
      <arrow> <attr>폭발 세기:</attr> %explosive-power%

  explosive_target_fiery:
    name: "화염 폭발 과녁"
    lore: |-
      <arrow> 맞으면 폭발하고 주변을 불태웁니다
      <arrow> <attr>폭발 세기:</attr> %explosive-power%

  explosive_target_super:
    name: "강력 폭발 과녁"
    lore: |-
      <arrow> 맞으면 강력하게 폭발합니다
      <arrow> <attr>폭발 세기:</attr> %explosive-power%

  explosive_target_super_fiery:
    name: "강력 화염 폭발 과녁"
    lore: |-
      <arrow> 맞으면 강력하게 폭발하고 주변을 불태웁니다
      <arrow> <attr>폭발 세기:</attr> %explosive-power%

  iron_bloom:
    name: "철 블룸"

  wrought_iron:
    name: "연철"

  tongs:
    name: "집게"
    lore: |-
      <arrow> 철 블룸을 수로에서 안전하게 꺼내는 데 사용됩니다
      <arrow> 또한 철 블룸 작업에도 사용됩니다

  bloomery:
    name: "수로"
    lore: |-
      <star> 멀티블록
      <arrow> 해면철을 녹여 강철을 만드는 장치입니다
      <arrow> 제작 과정:
      <arrow> 1 - <insn>석탄 블록 설치</insn>
      <arrow> 2 - <insn>블록 위에 석고 가루 1개 던지기</insn>
      <arrow> 3 - <insn>블록 위에 불 붙이기</insn>
      <arrow> <insn>오른쪽 클릭</insn>으로 아이템을 삽입합니다
      <arrow> <insn>집게를 들고 오른쪽 클릭</insn>으로 아이템을 안전하게 꺼냅니다

      <u>구성 요소</u>
      <diamond> 1x <yellow><item:pylon:bloomery/></yellow>
      <diamond> 4x <yellow><item:pylon:refractory_bricks/></yellow>

  bronze_anvil:
    name: "청동 모루"
    lore: |-
      <arrow> 철 블룸으로 연철을 만드는 데 사용됩니다
      <arrow> 목표는 블룸을 "일반적인" 모양이 되도록 두드리는 것입니다
      <arrow> <insn>오른쪽 클릭</insn>으로 모루에 아이템을 놓습니다
      <arrow> 망치를 들고 <insn>왼쪽 클릭</insn>으로 블룸을 짧게/넓게 만듭니다
      <arrow> <item:pylon:tongs/>를 들고 <insn>왼쪽 클릭</insn>으로 블룸을 더 길게/좁게 만듭니다
      <arrow> 모양의 변화 정도는 온도에 비례합니다
      <arrow> 온도가 0이고 블룸의 모양이 충분히 잡히면 <item:pylon:wrought_iron/>이 튀어나옵니다

  bronze_axe:
    name: "청동 도끼"

  bronze_boots:
    name: "청동 부츠"

  bronze_chestplate:
    name: "청동 흉갑"

  bronze_helmet:
    name: "청동 투구"

  bronze_hoe:
    name: "청동 괭이"

  bronze_leggings:
    name: "청동 레깅스"

  bronze_pickaxe:
    name: "청동 곡괭이"

  bronze_shovel:
    name: "청동 삽"

  bronze_sword:
    name: "청동 검"

  fiber:
    name: "섬유"

  flour:
    name: "밀가루"

  fluid_pipe_wood:
    name: "나무 유체 파이프"
    lore: |-
      <arrow> <insn>유른쪽 클릭</insn>으로 연결 지점, 다른 파이프, 블록을 지정하여 배치를 시작합니다
      <arrow> 설치된 파이프에 블록을 들고 <insn>오른쪽 클릭</insn>하여 파이프를 해당 블록으로 가립니다
      <arrow> 같은 종류의 파이프끼리만 연결할 수 있습니다
      <arrow> <attr>유량:</attr> %fluid_per_second%
      <arrow> <attr>온도:</attr> %temperatures%

  fluid_pipe_copper:
