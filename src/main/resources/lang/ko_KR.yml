  ice_arrow:
    name: "얼음 화살"
    lore: |-
      <arrow> 화살에 깃든 냉기가 적을 느리게 하고 얼립니다
      <arrow> <attr>냉각 시간:</attr> %freeze-duration%

  portable_fluid_tank_wood:
    name: "나무 휴대용 유체 탱크"
    lore: |-
      <arrow> 설치하고 파이프와 연결할 수 있습니다
      <arrow> 부숴도 내용물이 유지됩니다
      <arrow> 양동이로 <insn>오른쪽 클릭</insn>하여 유체를 추가/제거할 수 있습니다 (물과 용암만 작동합니다)
      <arrow> <attr>유체:</attr> %fluid%
      <arrow> <attr>한계 온도:</attr> %temperatures%

